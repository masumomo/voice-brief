# VoiceBrief Configuration Example
# コピーして config.yaml として使用してください
# トークン等の機密情報は .env ファイルまたは環境変数で管理してください

app:
  output_dir: "./out"
  log_level: "info" # debug | info | warn | error
  timezone: "Asia/Tokyo" # タイムゾーン（"Local" でシステム設定を使用）

slack:
  # 環境変数名を指定（実際のトークンは .env に記載）
  token_env: "VOICE_BRIEF_SLACK_TOKEN"

  # 監視対象チャンネル
  channels:
    - id: "C01234567"
      name: "general"
    - id: "C09876543"
      name: "dev-backend"

  # フィルタ設定
  filters:
    exclude_bots: true
    exclude_short_messages: true
    min_length: 10
    exclude_keywords:
      - "了解です"
      - "承知しました"
      - "ありがとうございます"

  # Slack投稿設定（オプション）
  post_enabled: false # true にすると自動投稿が有効になります
  post_channel: "" # ブリーフィング投稿先チャンネルID（例: C01234567）
  upload_audio: false # true にすると音声ファイルも添付します

notion:
  # 環境変数名を指定
  token_env: "VOICE_BRIEF_NOTION_TOKEN"

  # 監視対象データベース
  databases:
    - id: "db-uuid-xxxx"
      name: "Design Docs"
      properties: ["Status", "Tag", "Project"]
      max_content_blocks: 10 # ページ本文を10ブロック取得
    - id: "db-uuid-yyyy"
      name: "Task Board"
      properties: ["Status", "Assignee", "Priority"]
      max_content_blocks: 0 # 本文取得しない（プロパティのみ）
    # max_content_blocks を省略するとデフォルト5ブロック取得

# GitHub連携（オプション）
github:
  enabled: false
  token_env: "VOICE_BRIEF_GITHUB_TOKEN"
  username: "your-username" # フィルタ用（自分のアクティビティのみ取得）
  repositories: # 監視対象リポジトリ（owner/repo形式）
    - "owner/repository-name"
    # - "your-org/another-repo"

# ブリーフィング設定
brief:
  daily_window_hours: 24
  weekly_days: 7
  max_items_daily: 8
  max_items_weekly: 25

# 重要度計算エンジン設定（特徴量ベース）
# 20個の特徴量を使用してイベントの重要度を0-100で計算
# 各重みを省略するとデフォルト値が使用されます
importance:
  weights:
    # テキスト特徴量
    text_length: 5.0         # 本文の長さ
    title_length: 2.0        # タイトルの長さ
    has_mention: 15.0        # @メンション有無
    has_question: 5.0        # 疑問文か
    has_exclamation: 3.0     # 強調表現か
    has_url: 2.0             # URL含有
    keyword_score: 20.0      # 重要キーワードスコア

    # エンゲージメント特徴量
    comment_count: 15.0      # コメント数
    unique_commenters: 10.0  # ユニーク投稿者数
    total_comment_len: 5.0   # コメント総文字数

    # カテゴリ特徴量（重要: 大きい値ほど重要度が上がる）
    is_incident: 30.0        # 障害・インシデント
    is_dev: 5.0              # 開発
    is_biz: 3.0              # ビジネス
    is_ops: 8.0              # 運用

    # ソース特徴量
    is_slack: 0.0            # Slackソース
    is_notion: 2.0           # Notionソース
    is_github: 3.0           # GitHubソース

    # 時間特徴量
    hour_of_day: 0.0         # 時間帯
    is_business_hours: 2.0   # 営業時間内
    is_weekday: 1.0          # 平日

    # バイアス（ベーススコア）
    bias: 30.0

# カテゴリ判定エンジン設定
categorizer:
  provider: "rule" # "rule" | "gemini" | "openai"
  # gemini_model: "gemini-2.0-flash-exp"  # providerがgeminiの場合のみ
  # gemini_api_key_env: "GEMINI_API_KEY"  # Gemini使用時の環境変数名
  # openai_model: "gpt-4o-mini"  # providerがopenaiの場合
  # openai_api_key_env: "OPENAI_API_KEY"  # OpenAI使用時の環境変数名

# イベント要約エンジン設定（個々のイベントを要約）
event_summarizer:
  provider: "rule" # "rule" | "gemini" | "openai"
  max_summary_len: 200 # 要約の最大文字数
  # gemini_model: "gemini-2.0-flash-exp"  # providerがgeminiの場合のみ
  # gemini_api_key_env: "GEMINI_API_KEY"  # Gemini使用時の環境変数名
  # openai_model: "gpt-4o-mini"  # providerがopenaiの場合
  # openai_api_key_env: "OPENAI_API_KEY"  # OpenAI使用時の環境変数名

# ブリーフィング要約エンジン設定（全イベントからブリーフィングを生成）
brief_summarizer:
  provider: "rule" # "rule" | "gemini" | "openai"
  # gemini_model: "gemini-2.0-flash-exp"  # providerがgeminiの場合のみ
  # gemini_api_key_env: "GEMINI_API_KEY"  # Gemini使用時の環境変数名
  # openai_model: "gpt-4o-mini"  # providerがopenaiの場合（gpt-4o-mini, gpt-4o, gpt-4-turbo等）
  # openai_api_key_env: "OPENAI_API_KEY"  # OpenAI使用時の環境変数名

# 音声合成設定
tts:
  provider: "say" # "say" (macOS) | "sapi" (Windows) | "google_tts" | "openai_tts"
  voice: "Kyoko" # say/sapi: Kyoko, Otoya / google_tts: ja-JP-Neural2-B / openai_tts: alloy, echo, fable, onyx, nova, shimmer
  rate: 1.1 # 読み上げ速度（倍速）
  format: "m4a" # say: aiff, m4a, mp3 / sapi: wav, mp3 / google_tts: mp3, ogg, wav / openai_tts: mp3, opus, aac, flac
  # google_credentials_json_env: "GOOGLE_APPLICATION_CREDENTIALS_JSON"  # Google TTS使用時の認証情報環境変数名

# 実行時設定
runtime:
  max_concurrency: 5
  api_timeout_seconds: 30
